[project]
name = "dbttestenv"
version = "0.1.0"
description = "Generic library for running dbt models against an Oracle test container"
requires-python = ">=3.12.0"
dependencies = [
    "dbt-core>=1.12.0,<1.13.0",
    "dbt-oracle>=1.12.0,<1.13.0",
    "docker>=7.1.0",
    "faker>=40.36.0",
    "oracledb>=3.3.0,<26.0.0",
    "pyyaml>=6.0.2",
    "sqlacodegen>=3.1.1",
    "sqlalchemy>=2.0.51",
    "testcontainers[oracle-free]>=4.14.0",
    "pytest>=9.0.0",
]

[build-system]
requires = ["setuptools>=80.7.1"]
build-backend = "setuptools.build_meta"


[project.entry-points."pytest11"]
dbttestenv = "dbttestenv.pytest_plugin"

[project.scripts]
testenv = "dbttestenv.testenv:main"
model_generator = "dbttestenv.model_generator:main"

[tool.setuptools]
package-dir = {"dbttestenv" = "dbttestenv"}

[tool.setuptools.package-data]
dbttestenv = ["sql/*.sql"]
